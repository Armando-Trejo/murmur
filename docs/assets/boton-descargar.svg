<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64" width="290" height="64" role="img" aria-label="Descargar APK">
<title>Descargar APK</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbbdff"/><stop offset="1" stop-color="#9b87f5"/></linearGradient>
  <linearGradient id="o" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b4a2ff" stop-opacity=".9"/><stop offset="1" stop-color="#6f5bd6" stop-opacity=".6"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="288" height="62" rx="31"/></clipPath>
</defs>
<style>
  .sh{animation:sh 3.6s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sh{0%{transform:translateX(-160px)}55%,100%{transform:translateX(330px)}}
  .ic{animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  @media (prefers-reduced-motion: reduce){.sh{animation:none;opacity:0}.ic{animation:none}}
</style>
<rect x="1" y="1" width="288" height="62" rx="31" fill="url(#g)"/>
<g clip-path="url(#c)"><g transform="skewX(-20)"><rect class="sh" x="0" y="0" width="120" height="64" fill="url(#sh)" opacity=".7"/></g></g>
<g color="#120d24" transform="translate(26 20)"><g class="ic"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif">
  <text x="64" y="30" font-size="19" font-weight="700" fill="#120d24">Descargar APK</text>
  <text x="64" y="49" font-size="13" font-weight="500" fill="#2a2050">Android 8.0 o posterior</text>
</g>
</svg>
