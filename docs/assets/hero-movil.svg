  .w1{stroke:#b4a2ff;stroke-opacity:.38;stroke-width:1.6;animation:slide 9s linear infinite}
  .w2{stroke:#9b87f5;stroke-opacity:.22;stroke-width:1.2;animation:slide 13s linear infinite reverse}
  .w3{stroke:#ffffff;stroke-opacity:.10;stroke-width:1;animation:slide 17s linear infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-360px)}}
  .in{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .in2{animation-delay:.18s}.in3{animation-delay:.36s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .b,.au1,.au2,.au3,.w1,.w2,.w3,.dot{animation:none}
    .in{animation:none}
  }
</style>
