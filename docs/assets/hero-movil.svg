  .au1{animation:drift1 16s ease-in-out infinite alternate}
  .au2{animation:drift2 21s ease-in-out infinite alternate}
  .au3{animation:drift3 18s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate(-60px,10px)}to{transform:translate(120px,-30px)}}
  @keyframes drift2{from{transform:translate(80px,-20px)}to{transform:translate(-140px,30px)}}
  @keyframes drift3{from{transform:translate(0,0)}to{transform:translate(-90px,-40px)}}
