apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.personal.murmur"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        multiDexEnabled true
        applicationId "com.personal.murmur"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 31
        versionName "2.15.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Optional single-ABI build for direct phone downloads, e.g. -Pabi=arm64-v8a.
        if (project.hasProperty('abi')) {
            ndk { abiFilters project.property('abi').toString() }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from the environment (scripts/compilar-release.ps1 reads it from the
    // local vault); without it, assembleRelease produces an unsigned APK.
    signingConfigs {
        release {
            def store = System.getenv('MURMUR_KEYSTORE')
            if (store) {
                storeFile file(store)
                storeType 'PKCS12'
                storePassword System.getenv('MURMUR_KEYSTORE_PASSWORD')
                keyAlias 'murmur'
                keyPassword System.getenv('MURMUR_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('MURMUR_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true
    unitTests.all {
        systemProperty 'murmur.networkSmoke', project.hasProperty('networkSmoke') ? 'true' : 'false'
        systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    } }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

tasks.register('compileSpotifyNative', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build-spotify-native.mjs'
    inputs.files(fileTree('../../native/spotify') { include '**/*.rs', '**/Cargo.toml', 'Cargo.lock'; exclude 'target/**' })
    inputs.file('../../scripts/build-spotify-native.mjs')
    outputs.files(['arm64-v8a','armeabi-v7a','x86','x86_64'].collect { file("src/main/jniLibs/${it}/libmurmurspotify.so") })
}
tasks.named('preBuild').configure { dependsOn 'compileSpotifyNative' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation files('libs/spotify-app-remote-release-0.8.0.aar')
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.mediapipe:tasks-text:0.10.14'
    // Offline keyword spotting for "ok murmur" (Vosk, Apache-2.0); the Spanish model is downloaded on opt-in.
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
